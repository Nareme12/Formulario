<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('https://images.pexels.com/photos/34155534/pexels-photo-34155534.jpeg?cs=srgb&dl=pexels-moklebust-34155534.jpg&fm=jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #313030;
      color: #ffffff;
      padding: 35px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 500px;
    }

    h2 {
      margin-bottom: 24px;
      color: #ffffff;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e0e0e0;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #4f4e4e;
      border-radius: 6px;
      background-color: #242323;
      color: #ffffff;
      font-size: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="text"]::placeholder,
    input[type="email"]::placeholder,
    textarea::placeholder {
      color: #9e9e9e;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px dashed #555555;
      border-radius: 6px;
      background-color: #242323;
      color: #d0d0d0;
      cursor: pointer;
      font-size: 13px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .file-hint {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: #aaaaaa;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Contact Us</h2>
    
    <form action="https://formsubmit.co/nareme12@gmail.com" method="POST" enctype="multipart/form-data">
      
      <!-- Desactiva el captcha automático de FormSubmit -->
      <input type="hidden" name="_captcha" value="false">

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Reason for contacting" required>
      </div>

      <div class="form-group">
        <label for="description">Description / Message</label>
        <textarea id="description" name="description" placeholder="Write your message here..." required></textarea>
      </div>

      <div class="form-group">
        <label for="attachment">Attachment (Optional)</label>
        <input type="file" id="attachment" name="attachment" accept=".pdf, .jpg, .jpeg, .png">
        <span class="file-hint">Allowed formats: PDF, JPG, PNG</span>
      </div>

      <button type="submit">Send Message</button>

    </form>
  </div>

</body>
</html>
